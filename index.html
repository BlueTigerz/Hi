<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BlueTigerz Minecraft Tetris</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at center, transparent 0%, #000000aa 70%, #000000ff 100%),
        #2f2f2f;
      /* if you later add a stone image, you can do:
         background:
           radial-gradient(circle at center, transparent 0%, #000000aa 70%, #000000ff 100%),
           url("stone.png");
      */
      background-size: cover;
      background-position: center;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #game {
      display: grid;
      grid-template-columns: repeat(10, 24px);
      grid-template-rows: repeat(20, 24px);
      gap: 1px;
      background: #2e2e2e;
      padding: 6px;
      border-radius: 6px;
      box-shadow: 0 0 20px #000;
    }

    .cell {
      width: 24px;
      height: 24px;
      background: #000;
      border-radius: 2px;
    }

    /* Diamond block (I-piece) */
    .i-piece {
      background:
        radial-gradient(circle at 20% 20%, #ffffff66 0, transparent 40%),
        radial-gradient(circle at 80% 80%, #ffffff33 0, transparent 45%),
        linear-gradient(135deg, #6df2ff, #2aa8cc);
      box-shadow: inset 0 0 8px #1a6a80;
    }

    /* Grass block (O-piece) */
    .o-piece {
      background:
        repeating-linear-gradient(
          90deg,
          #4caf50,
          #4caf50 4px,
          #3e8e41 4px,
          #3e8e41 8px
        ),
        linear-gradient(#4caf50 40%, #6d4c41 40%);
      box-shadow: inset 0 0 6px #1b5e20;
    }

    /* Stone Brick (T-piece) */
    .t-piece {
      background:
        repeating-linear-gradient(
          90deg,
          #7d7d7d,
          #7d7d7d 8px,
          #6a6a6a 8px,
          #6a6a6a 16px
        ),
        repeating-linear-gradient(
          0deg,
          #8d8d8d,
          #8d8d8d 8px,
          #7a7a7a 8px,
          #7a7a7a 16px
        );
      box-shadow: inset 0 0 6px #3a3a3a;
    }

    /* Cobblestone (J-piece) */
    .j-piece {
      background:
        radial-gradient(circle at 20% 30%, #bdbdbd 0, #757575 40%),
        radial-gradient(circle at 70% 60%, #bdbdbd 0, #616161 45%),
        repeating-linear-gradient(
          45deg,
          #9e9e9e,
          #9e9e9e 4px,
          #757575 4px,
          #757575 8px
        );
      box-shadow: inset 0 0 6px #424242;
    }

    /* Oak planks (L-piece) */
    .l-piece {
      background:
        repeating-linear-gradient(
          90deg,
          #c49b63,
          #c49b63 6px,
          #b07f4f 6px,
          #b07f4f 12px
        ),
        linear-gradient(#c49b63, #a67c52);
      box-shadow: inset 0 0 6px #5d3f1f;
    }

    /* Leaves (S-piece) */
    .s-piece {
      background:
        radial-gradient(circle at 20% 20%, #66bb6a 0, transparent 40%),
        radial-gradient(circle at 80% 70%, #43a047 0, transparent 45%),
        repeating-linear-gradient(
          45deg,
          #4caf50,
          #4caf50 4px,
          #388e3c 4px,
          #388e3c 8px
        );
      box-shadow: inset 0 0 6px #1b5e20;
    }

    /* Redstone block (Z-piece) */
    .z-piece {
      background:
        radial-gradient(circle at 30% 30%, #ff7777 0, transparent 40%),
        radial-gradient(circle at 70% 70%, #ff4444 0, transparent 45%),
        linear-gradient(135deg, #ff3b3b, #b30000);
      box-shadow: inset 0 0 8px #4a0000;
    }

    #scoreboard {
      margin-top: 10px;
      font-size: 16px;
      color: #55ff55;
      text-shadow: 0 0 4px #2b7c2b;
    }

    #info {
      margin-top: 6px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>

  <!-- MUSIC -->
  <audio id="bgm" src="MinecraftCreator8bitVRC6Cover.mp3" loop></audio>

  <h1 style="color:#55ff55; text-shadow:0 0 10px #2b7c2b;">Minecraft Tetris</h1>

  <div id="game"></div>

  <div id="scoreboard">
    Score: <span id="score">0</span> |
    High Score: <span id="highscore">0</span>
  </div>

  <div id="info">
    Controls: ← → or A D to move, ↑ or W to rotate, ↓ or S to drop faster.
  </div>

  <script>
    /* Fade in + music */
    window.onload = () => {
      document.body.style.opacity = "1";

      const bgm = document.getElementById("bgm");
      bgm.volume = 0.4;
      bgm.play().catch(() => {
        console.log("Autoplay blocked until user interacts.");
      });

      document.addEventListener("keydown", () => {
        bgm.play();
      }, { once: true });
    };

    const rows = 20;
    const cols = 10;
    const game = document.getElementById('game');

    let score = 0;
    let highScore = localStorage.getItem("tetrisHighScoreMinecraft") || 0;
    document.getElementById("highscore").innerText = highScore;

    let grid = [];
    for (let r = 0; r < rows; r++) {
      grid[r] = [];
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        game.appendChild(cell);
        grid[r][c] = { filled: false, type: null, el: cell };
      }
    }

    const shapes = [
      { shape: [[1,1,1,1]], type: 'i-piece' },          // Diamond
      { shape: [[1,1],[1,1]], type: 'o-piece' },        // Grass
      { shape: [[0,1,0],[1,1,1]], type: 't-piece' },    // Stone Brick
      { shape: [[1,0,0],[1,1,1]], type: 'j-piece' },    // Cobblestone
      { shape: [[0,0,1],[1,1,1]], type: 'l-piece' },    // Planks
      { shape: [[1,1,0],[0,1,1]], type: 's-piece' },    // Leaves
      { shape: [[0,1,1],[1,1,0]], type: 'z-piece' }     // Redstone
    ];

    let current = null;
    let curRow = 0;
    let curCol = 3;
    let interval = null;

    function newPiece() {
      const pick = shapes[Math.floor(Math.random() * shapes.length)];
      current = {
        shape: pick.shape.map(row => row.slice()),
        type: pick.type
      };
      curRow = 0;
      curCol = 3;
    }

    function collides(r, c, shape) {
      for (let i = 0; i < shape.length; i++) {
        for (let j = 0; j < shape[i].length; j++) {
          if (shape[i][j]) {
            const nr = r + i;
            const nc = c + j;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) return true;
            if (grid[nr][nc].filled) return true;
          }
        }
      }
      return false;
    }

    function mergePiece() {
      for (let i = 0; i < current.shape.length; i++) {
        for (let j = 0; j < current.shape[i].length; j++) {
          if (current.shape[i][j]) {
            const nr = curRow + i;
            const nc = curCol + j;
            grid[nr][nc].filled = true;
            grid[nr][nc].type = current.type;
          }
        }
      }
      clearLines();
    }

    function clearLines() {
      let linesCleared = 0;

      for (let r = rows - 1; r >= 0; r--) {
        let full = true;
        for (let c = 0; c < cols; c++) {
          if (!grid[r][c].filled) {
            full = false;
            break;
          }
        }
        if (full) {
          linesCleared++;
          for (let rr = r; rr > 0; rr--) {
            for (let c = 0; c < cols; c++) {
              grid[rr][c].filled = grid[rr-1][c].filled;
              grid[rr][c].type = grid[rr-1][c].type;
            }
          }
          for (let c = 0; c < cols; c++) {
            grid[0][c].filled = false;
            grid[0][c].type = null;
          }
          r++;
        }
      }

      if (linesCleared > 0) {
        score += linesCleared * 100;
        document.getElementById("score").innerText = score;

        if (score > highScore) {
          highScore = score;
          localStorage.setItem("tetrisHighScoreMinecraft", highScore);
          document.getElementById("highscore").innerText = highScore;
        }
      }
    }

    function rotate(shape) {
      const h = shape.length;
      const w = shape[0].length;
      const res = [];
      for (let c = 0; c < w; c++) {
        res[c] = [];
        for (let r = h - 1; r >= 0; r--) {
          res[c].push(shape[r][c]);
        }
      }
      return res;
    }

    function draw() {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = grid[r][c];
          cell.el.className = 'cell';
          if (cell.filled && cell.type) {
            cell.el.classList.add(cell.type);
          }
        }
      }
      if (current) {
        for (let i = 0; i < current.shape.length; i++) {
          for (let j = 0; j < current.shape[i].length; j++) {
            if (current.shape[i][j]) {
              const nr = curRow + i;
              const nc = curCol + j;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                grid[nr][nc].el.classList.add(current.type);
              }
            }
          }
        }
      }
    }

    function step() {
      if (!current) return;
      if (!collides(curRow + 1, curCol, current.shape)) {
        curRow++;
      } else {
        mergePiece();
        newPiece();
      }
      draw();
    }

    document.addEventListener('keydown', e => {
      if (!current) return;

      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        if (!collides(curRow, curCol - 1, current.shape)) curCol--;
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        if (!collides(curRow, curCol + 1, current.shape)) curCol++;
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        if (!collides(curRow + 1, curCol, current.shape)) curRow++;
      } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        const rotated = rotate(current.shape);
        if (!collides(curRow, curCol, rotated)) current.shape = rotated;
      }
      draw();
    });

    newPiece();
    draw();
    interval = setInterval(step, 500);
  </script>

</body>
</html>
