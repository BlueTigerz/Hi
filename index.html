<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BlueTigerz Minecraft Tetris</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at center, transparent 0%, #000000aa 70%, #000000ff 100%),
        #2f2f2f;
      background-size: cover;
      background-position: center;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #game {
      display: grid;
      grid-template-columns: repeat(10, 24px);
      grid-template-rows: repeat(20, 24px);
      gap: 1px;
      background: #2e2e2e;
      padding: 6px;
      border-radius: 6px;
      box-shadow: 0 0 20px #000;
    }

    .cell {
      width: 24px;
      height: 24px;
      background: #000;
      border-radius: 2px;
    }

    .i-piece { background-image: url("diamondore.png"); background-size: cover; }
    .o-piece { background-image: url("coalore.png"); background-size: cover; }
    .t-piece { background-image: url("cobblestone.png"); background-size: cover; }
    .j-piece { background-image: url("planksoak.png"); background-size: cover; }
    .l-piece { background-image: url("bookshelf.png"); background-size: cover; }
    .s-piece { background-image: url("grassblockside.png"); background-size: cover; }
    .z-piece { background-image: url("tnt.png"); background-size: cover; }

    #scoreboard {
      margin-top: 10px;
      font-size: 16px;
      color: #55ff55;
      text-shadow: 0 0 4px #2b7c2b;
    }

    #info {
      margin-top: 6px;
      font-size: 14px;
      color: #ccc;
    }

    #leaderboard {
      margin-top: 20px;
      color: #55ff55;
      text-shadow: 0 0 4px #2b7c2b;
      font-size: 16px;
    }

    #leaderboard table {
      border-collapse: collapse;
      margin-top: 10px;
    }

    #leaderboard th, #leaderboard td {
      padding: 4px 10px;
      border-bottom: 1px solid #55ff55;
    }
  </style>
</head>
<body>

  <audio id="bgm" src="MinecraftCreator8bitVRC6Cover.mp3" loop></audio>

  <h1 style="color:#55ff55; text-shadow:0 0 10px #2b7c2b;">Minecraft Tetris</h1>

  <div id="game"></div>

  <div id="scoreboard">
    Score: <span id="score">0</span> |
    High Score: <span id="highscore">0</span>
  </div>

  <div id="info">
    Controls: ← → or A D to move, ↑ or W to rotate, ↓ or S to drop faster.
  </div>

  <!-- LEADERBOARD SECTION -->
  <div id="leaderboard">
    <h2>Leaderboard</h2>
    <div id="leaderboardData">Loading...</div>
  </div>

  <!-- External score sender -->
  <script src="score.js"></script>

  <script>
    window.onload = () => {
      document.body.style.opacity = "1";

      const bgm = document.getElementById("bgm");
      bgm.volume = 0.4;
      bgm.play().catch(() => {});

      document.addEventListener("keydown", () => {
        bgm.play();
      }, { once: true });

      loadLeaderboard();
    };

    const rows = 20;
    const cols = 10;
    const game = document.getElementById('game');

    let score = 0;
    let highScore = localStorage.getItem("tetrisHighScoreMinecraft") || 0;
    document.getElementById("highscore").innerText = highScore;

    let grid = [];
    for (let r = 0; r < rows; r++) {
      grid[r] = [];
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        game.appendChild(cell);
        grid[r][c] = { filled: false, type: null, el: cell };
      }
    }

    const shapes = [
      { shape: [[1,1,1,1]], type: 'i-piece' },
      { shape: [[1,1],[1,1]], type: 'o-piece' },
      { shape: [[0,1,0],[1,1,1]], type: 't-piece' },
      { shape: [[1,0,0],[1,1,1]], type: 'j-piece' },
      { shape: [[0,0,1],[1,1,1]], type: 'l-piece' },
      { shape: [[1,1,0],[0,1,1]], type: 's-piece' },
      { shape: [[0,1,1],[1,1,0]], type: 'z-piece' }
    ];

    let current = null;
    let curRow = 0;
    let curCol = 3;
    let interval = null;

    function newPiece() {
      const pick = shapes[Math.floor(Math.random() * shapes.length)];
      current = {
        shape: pick.shape.map(row => row.slice()),
        type: pick.type
      };
      curRow = 0;
      curCol = 3;

      if (collides(curRow, curCol, current.shape)) {
        clearInterval(interval);
        alert("Game Over!");

        const username = prompt("Enter your username for the leaderboard:", "player");

        if (username && typeof sendScore === "function") {
          sendScore(username, score);
        }
      }
    }

    function collides(r, c, shape) {
      for (let i = 0; i < shape.length; i++) {
        for (let j = 0; j < shape[i].length; j++) {
          if (shape[i][j]) {
            const nr = r + i;
            const nc = c + j;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) return true;
            if (grid[nr][nc].filled) return true;
          }
        }
      }
      return false;
    }

    function mergePiece() {
      for (let i = 0; i < current.shape.length; i++) {
        for (let j = 0; j < current.shape[i].length; j++) {
          if (current.shape[i][j]) {
            const nr = curRow + i;
            const nc = curCol + j;
            grid[nr][nc].filled = true;
            grid[nr][nc].type = current.type;
          }
        }
      }
      clearLines();
    }

    function clearLines() {
      let linesCleared = 0;

      for (let r = rows - 1; r >= 0; r--) {
        let full = true;
        for (let c = 0; c < cols; c++) {
          if (!grid[r][c].filled) {
            full = false;
            break;
          }
        }
        if (full) {
          linesCleared++;
          for (let rr = r; rr > 0; rr--) {
            for (let c = 0; c < cols; c++) {
              grid[rr][c].filled = grid[rr-1][c].filled;
              grid[rr][c].type = grid[rr-1][c].type;
            }
          }
          for (let c = 0; c < cols; c++) {
            grid[0][c].filled = false;
            grid[0][c].type = null;
          }
          r++;
        }
      }

      if (linesCleared > 0) {
        score += linesCleared * 100;
        document.getElementById("score").innerText = score;

        if (score > highScore) {
          highScore = score;
          localStorage.setItem("tetrisHighScoreMinecraft", highScore);
          document.getElementById("highscore").innerText = highScore;
        }
      }
    }

    function rotate(shape) {
      const h = shape.length;
      const w = shape[0].length;
      const res = [];
      for (let c = 0; c < w; c++) {
        res[c] = [];
        for (let r = h - 1; r >= 0; r--) {
          res[c].push(shape[r][c]);
        }
      }
      return res;
    }

    function draw() {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = grid[r][c];
          cell.el.className = 'cell';
          if (cell.filled && cell.type) {
            cell.el.classList.add(cell.type);
          }
        }
      }
      if (current) {
        for (let i = 0; i < current.shape.length; i++) {
          for (let j = 0; j < current.shape[i].length; j++) {
            if (current.shape[i][j]) {
              const nr = curRow + i;
              const nc = curCol + j;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                grid[nr][nc].el.classList.add(current.type);
              }
            }
          }
        }
      }
    }

    function step() {
      if (!current) return;
      if (!collides(curRow + 1, curCol, current.shape)) {
        curRow++;
      } else {
        mergePiece();
        newPiece();
      }
      draw();
    }

    document.addEventListener('keydown', e => {
      if (!current) return;

      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        if (!collides(curRow, curCol - 1, current.shape)) curCol--;
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        if (!collides(curRow, curCol + 1, current.shape)) curCol++;
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        if (!collides(curRow + 1, curCol, current.shape)) curRow++;
      } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        const rotated = rotate(current.shape);
        if (!collides(curRow, curCol, rotated)) current.shape = rotated;
      }
      draw();
    });

    newPiece();
    draw();
    interval = setInterval(step, 500);

    /* ⭐⭐ LEADERBOARD FETCH ⭐⭐ */
    function loadLeaderboard() {
      fetch("https://briefs-gay-stanford-superior.trycloudflare.com/get_leaderboard.php")
      .then(res => res.json())
      .then(data => {
        let html = "<table>";
        html += "<tr><th>Player</th><th>Score</th><th>Highscore</th></tr>";

        data.forEach(row => {
          html += `<tr>
                     <td>${row.username}</td>
                     <td>${row.score}</td>
                     <td>${row.highscore}</td>
                   </tr>`;
        });

        html += "</table>";
        document.getElementById("leaderboardData").innerHTML = html;
      })
      .catch(err => {
        document.getElementById("leaderboardData").innerHTML = "Error loading leaderboard.";
        console.error(err);
      });
    }
  </script>

</body>
</html>
